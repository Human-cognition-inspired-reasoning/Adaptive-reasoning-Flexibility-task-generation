<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tower of Hanoi experiment logs</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header>
    <div>
      <h1>Tower of Hanoi experiment logs</h1>
      <p>Saved model runs</p>
    </div>
    <button id="refresh">Refresh</button>
  </header>
  <main>
    <aside>
      <h2>Runs</h2>
      <div id="runs"></div>
      <p>Start or resume a run from the terminal.</p>
    </aside>
    <section>
      <p id="notice" role="status">Select a run.</p>
      <nav id="downloads" aria-label="Download report" hidden>
        <a id="json" download>JSON</a>
        <a id="csv" download>CSV</a>
        <a id="html" download>HTML report</a>
      </nav>
      <iframe id="report" title="Selected run report" hidden></iframe>
      <details id="inspector" hidden>
        <summary>Submissions and move replay</summary>
        <label>Submission <select id="trial"></select></label>
        <button id="load-trial">Open</button>
        <div id="trace"></div>
        <details><summary>API request</summary><pre id="request"></pre></details>
        <details><summary>API response</summary><pre id="response"></pre></details>
        <details><summary>Grading record</summary><pre id="record"></pre></details>
      </details>
    </section>
  </main>
</body>
</html>
