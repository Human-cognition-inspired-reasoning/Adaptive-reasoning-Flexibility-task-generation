# Claude Opus 5.5 · medium · 3 types × 100 problems
# source ./keys.sh anthropic
# .venv/bin/python run.py --profile opus
config_version = 1
default_profile = "opus"

[experiment]
dataset = "../data/benchmark_300.json"
problems = 300
start_problem = 1
T = 10
k = 2
r1_apply_k = true
max_output_tokens = 25000
timeout = 180.0
feedback_policy = "four_way"

[profiles.opus]
label = "Claude Opus 5.5 · medium"
provider = "anthropic"
model = "claude-opus-5-5"
effort = "medium"
